name: Update BTC daily prices

on:
  schedule:
    # 12:00 UTC daily (after CoinGecko's completed-day cutoff)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update.js

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_daily.csv
          if git diff --staged --quiet; then
            echo "btc_daily.csv is already up to date — nothing to commit."
          else
            git commit -m "chore: update btc_daily.csv from CoinGecko"
            git push
          fi
